project:
  type: book
  output-dir: _book
  resources:
    - assets/*
  preview:
    port: 4200

execute:
  freeze: auto  # Only re-execute when source files change

book:
  title: "Scientific Programming"
  subtitle: "A computer supported approach to engineering mathematics"
  author: 
    - name: "Mirza Cenanovic"
      affiliation: "Jönköping University, School of Engineering"
      email: "mirza.cenanovic@ju.se"
    - name: "Johan Jansson"
      affiliation: "Jönköping University, School of Engineering"
      email: "johan.jansson@ju.se"
    - name: "Carl-Johan Jonsson"
      affiliation: "Jönköping University, School of Engineering"
      email: "Carl-Johan.Jonsson@ju.se"
  page-navigation: true
  sidebar:
    #style: "floating"
    search: true
    collapse-level: 1
    
  chapters:
    - index.qmd
    - python_installation.qmd
    - acknowlegments.qmd
    - part: "Programming fundamentals"
      chapters:
        - ProgrammingFundamentals/best_practices.qmd
        - ProgrammingFundamentals/basics.qmd
        - ProgrammingFundamentals/functions.qmd
        - ProgrammingFundamentals/data_structures_builtin.qmd
        - ProgrammingFundamentals/objects.qmd
        - ProgrammingFundamentals/file_io.qmd
        - ProgrammingFundamentals/debugging.qmd
        - ProgrammingFundamentals/version_control.qmd
        - ProgrammingFundamentals/writing_documentation.ipynb
    - part: "NumPy/SciPy"
      chapters:
        - NumpyScipy/numpy_arrays.qmd
        - NumpyScipy/numpy_linear_algebra.qmd
        - NumpyScipy/scipy_optimization.qmd
        - NumpyScipy/scipy_interpolation.qmd
        - NumpyScipy/data_structures_pandas.qmd
    - part: "SymPy"
      chapters:
        - Sympy/sympy_mixed.qmd

    - part: "Matplotlib"
      chapters:
        - MatplotLib/plotting_examples.ipynb
        - MatplotLib/Animations.ipynb
        - MatplotLib/ReplicatingInterp.qmd

        
    - part: "Applied Mathematics"
      chapters:
        - AppliedMaths/index.ipynb
        - AppliedMaths/root_finding.qmd
        - AppliedMaths/Differential_Equations.ipynb
        - AppliedMaths/Interpolation_Methods.ipynb
        - AppliedMaths/Numerical_Differentiation.ipynb
        - AppliedMaths/Numerical_Integration.ipynb
        - AppliedMaths/Time_Integration_Methods.ipynb
        - AppliedMaths/Interpolation2D.ipynb
        - AppliedMaths/Optimization_Methods.ipynb
        
    
    - part: "Applications"
      chapters:
        - Applications/index.qmd
        - Applications/ComputationalThinking.ipynb
        - Applications/Kinematics.ipynb
        - Applications/FEM_in_python.ipynb
        - Applications/SystematicTrussAnalysis.ipynb
        - Applications/TrussViz.ipynb
        - Applications/parsing_files.qmd
        - Applications/fusion360api.qmd
        - Applications/PendulumSimulation.ipynb

    - part: "MechanicsKit API"
      chapters:
        - MechanicsKitDocs/index.qmd
        - MechanicsKitDocs/latex_display.qmd
        - MechanicsKitDocs/mesh.qmd
        - MechanicsKitDocs/onearray.qmd
        - MechanicsKitDocs/plotting.qmd
        - MechanicsKitDocs/colormaps.qmd
        - MechanicsKitDocs/gaussint.qmd
        - MechanicsKitDocs/examples_fplot.ipynb
        - MechanicsKitDocs/examples_patch.ipynb

#comments:
#  hypothesis: true  
filters:
  - lastModified.lua
bibliography: references.bib
csl: elsevier-vancouver.csl
reference-section-title: "References"
format:
  
  html:
    cover-image: graphics/pyt.png
    #page-layout: full
    theme:
      dark: [darkly, dark.scss, custom.scss]
      light: [flatly, light.scss, custom.scss]
    filters:
      - hint.lua
      - color-emphasis.lua
      - lastModified.lua
    toc: true
    code-fold: True
    html-math-method:
      #method: katex
      method: mathjax
      url: https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js
    #embed-resources: true
    header-includes: |
      <link href='https://fonts.googleapis.com/css?family=Vollkorn' rel='stylesheet'>
      <link rel="stylesheet" type="text/css" href="https://cdn.rawgit.com/dreampulse/computer-modern-web-font/master/fonts.css">
    include-after-body:
      - footer.html
      - text: |
          <script src="/js/sidebar-state.js"></script>
    number-sections: true
    number-depth: 1
    crossref:
      eq-prefix: ""
      
  #pdf:
  #  documentclass: book

  #latex:
  #  preamble: |
  #    \usepackage{xcolor}



